site_name: Projeto de Software — 2026.2
site_description: Material de estudo de Projeto de Software e Gestão Ágil
site_author: Djairo Dantas
site_url: https://djairofilho.github.io/projsoft-2026-2/
repo_url: https://github.com/djairofilho/projsoft-2026-2
repo_name: djairofilho/projsoft-2026-2

extra_css:
  - assets/stylesheets/extra.css

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/sitemap
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
  features:
    - content.code.copy
    - content.code.select
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Aulas:
      - Visão geral: aulas/index.md
      - "Aula 01: Arquitetura e qualidade":
          - Visão geral: aulas/aula-01-introducao.md
          - 01.1 Requisitos de qualidade: aulas/aula-01-requisitos-qualidade.md
          - 01.2 Decisões e trade-offs: aulas/aula-01-decisoes-arquiteturais.md
      - "Aula 02: Manutenibilidade":
          - Visão geral e SOLID: aulas/aula-02-manutenibilidade.md
          - 02.1 Padrões fundamentais: aulas/aula-02-padroes-fundamentais.md
          - 02.2 Padrões complementares: aulas/aula-02-padroes-complementares.md
      - "Aula 03: Containers e implantação":
          - 03.1 Docker, imagens e containers: aulas/aula-03-docker.md
          - 03.2 Implantação manual na AWS: aulas/aula-03-tutorial-aws.md
      - "Aula 04: Confiabilidade":
          - Visão geral: aulas/aula-04-confiabilidade.md
          - 04.1 Testes, erros e idempotência: aulas/aula-04-testes-erros.md
          - 04.2 Entrega e observabilidade: aulas/aula-04-entrega-observabilidade.md
      - "Aula 05: Redes Docker": aulas/aula-05-redes-docker.md
  - Referências rápidas:
      - Docker: referencias/docker.md
      - Docker Compose: referencias/docker-compose.md
      - Docker Hub: referencias/docker-hub.md
      - Máquinas AWS: referencias/aws.md
      - Glossário: referencias/glossario.md
      - Bibliografia e O’Reilly: referencias/bibliografia.md
  - Fontes e atribuição: fontes.md
